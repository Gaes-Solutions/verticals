<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Sin conexión · Tu tienda</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px 0; background: #f3f7f6; color: #102e2b; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(28rem, calc(100% - 32px)); padding: 40px 24px; background: white; border: 1px solid #dce8e5; border-radius: 24px; box-shadow: 0 16px 48px #14332c0a; text-align: center; }
      .symbol { display: grid; place-items: center; width: 80px; height: 80px; margin: 0 auto 24px; border-radius: 24px; background: #e6f4f0; color: #0f766e; }
      .label { margin: 0 0 8px; color: #0f766e; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0 0 12px; font-size: clamp(27px, 6vw, 34px); line-height: 1.2; letter-spacing: -.03em; }
      p { margin: 0 0 24px; color: #50665f; }
      button, a { display: block; width: 100%; min-height: 48px; border-radius: 12px; font: inherit; font-weight: 650; cursor: pointer; }
      button { padding: 12px; border: 0; background: #0f766e; color: white; }
      button:hover { background: #115e59; }
      a { padding: 12px; margin-top: 8px; color: #0f766e; text-decoration: none; }
      a:hover { background: #f0f7f5; }
      :focus-visible { outline: 3px solid #14b8a6; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="symbol" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3 3 18 18M8.5 8.5a8 8 0 0 1 9.2 1.2M5 10.5a11 11 0 0 0-2 1.7M6 15a8 8 0 0 1 5.1-2M10 18a3 3 0 0 1 4 0M12 21h.01M13 5a13 13 0 0 1 8 3" /></svg>
      </div>
      <p class="label">Seguimos aquí</p>
      <h1>Se perdió la conexión</h1>
      <p>Revisa tu conexión a internet para volver a la tienda, consultar tu cuenta o continuar tu compra.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <a href="/">Volver a la tienda</a>
    </main>
  </body>
</html>
