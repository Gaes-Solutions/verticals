appId: com.gaessoft.cliente.staging
name: Gaesland guest catalog, image controls and login recovery
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Buscar artículos
    timeout: 60000
- assertNotVisible: mi-tienda
- takeScreenshot: gaesland-inicio
# Filter UI uses stable test IDs; category IDs come from the tenant API.
- tapOn:
    id: catalog-filter-open
- assertVisible: Filtrar y ordenar
- assertVisible: Categoría
- assertVisible: "Categoría: Todas"
- scrollUntilVisible:
    element: Precio mínimo
- assertVisible: Precio máximo
- scrollUntilVisible:
    element:
      id: catalog-filter-offers
- assertVisible:
    id: catalog-filter-offers
- scrollUntilVisible:
    element:
      id: catalog-filter-in-stock
- tapOn:
    id: catalog-filter-in-stock
- scrollUntilVisible:
    element: "Orden: Recomendados"
- assertVisible: Ordenar por
- takeScreenshot: gaesland-filtros
- tapOn:
    id: catalog-filter-apply
- assertVisible: Solo disponibles
- assertVisible: Filtrar y ordenar, 1 activos
- takeScreenshot: gaesland-filtro-disponibles
# Closing discards an edited draft instead of applying it.
- tapOn:
    id: catalog-filter-open
- scrollUntilVisible:
    element:
      id: catalog-filter-offers
- tapOn:
    id: catalog-filter-offers
- tapOn: Cerrar filtros
- assertVisible: Solo disponibles
- assertNotVisible: Solo ofertas
- assertVisible: Filtrar y ordenar, 1 activos
# Clear the applied filter before the existing positive product search.
- tapOn:
    id: catalog-filter-open
- tapOn:
    id: catalog-filter-clear
- assertNotVisible: Solo disponibles
- assertVisible: Filtrar y ordenar
- tapOn: Buscar artículos
- inputText: Licuadora
- hideKeyboard
- tapOn: Buscar
- extendedWaitUntil:
    visible: Ver Licuadora de cocina
    timeout: 60000
- tapOn: Ver Licuadora de cocina
- extendedWaitUntil:
    visible: Ampliar imagen de Licuadora de cocina
    timeout: 30000
- takeScreenshot: gaesland-producto
- tapOn: Ampliar imagen de Licuadora de cocina
- tapOn: Ampliar imagen
- assertVisible: 150% · Restablecer
- tapOn: Girar imagen 90 grados
- takeScreenshot: gaesland-imagen-girada
- tapOn: Restablecer imagen
- assertVisible: 100% · Restablecer
- tapOn: Cerrar imagen
- scrollUntilVisible:
    element: Agregar al carrito
- tapOn: Agregar al carrito
- extendedWaitUntil:
    visible: Tu artículo te espera. Entra para guardarlo en tu carrito.
    timeout: 15000
- assertNotVisible: mi-tienda
- assertVisible: Correo
- takeScreenshot: gaesland-login-sin-selector-tienda
- tapOn: .*Olvidaste tu contraseña.*
- assertVisible: Recuperar contraseña
- assertVisible: Enviar enlace
- assertNotVisible: mi-tienda
- takeScreenshot: gaesland-recuperacion
