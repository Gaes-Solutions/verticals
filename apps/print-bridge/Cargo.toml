[package]
name = "gaespos-print-bridge"
version = "0.2.0"
description = "Impresión ESC/POS local para GaesSoft"
authors = ["Gaes Solutions"]
edition = "2021"
rust-version = "1.78"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
sha2 = "0.10"
