name: Staging — Build & Deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build + push ${{ matrix.app }} → GHCR (staging)
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web-tienda, web-admin, web-pos, web-superadmin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Metadata (staging + SHA)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=raw,value=staging
            type=sha,format=short,prefix=staging-
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=staging-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.app }}

  notify-coolify-staging:
    name: Trigger Coolify staging webhook
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ vars.COOLIFY_WEBHOOK_URL != '' }}
    steps:
      - name: POST al webhook de staging
        env:
          WEBHOOK_URL: ${{ vars.COOLIFY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 30 -X GET "${WEBHOOK_URL}" \
            -H "Authorization: Bearer ${WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json"
