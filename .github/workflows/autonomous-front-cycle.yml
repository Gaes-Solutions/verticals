name: Autonomous storefront cycle

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: autonomous-front-cycle
  cancel-in-progress: false

jobs:
  execute-review-merge:
    if: ${{ vars.AUTONOMOUS_FRONT_ENABLED == 'true' }}
    # Runner propio con `kimi`, `codex` y `gh` instalados. Las CLIs nunca se
    # descargan desde el repositorio ni se reciben por entrada del usuario.
    runs-on: [self-hosted, kimi-codex]
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      KIMI_BIN: ${{ vars.KIMI_BIN || 'kimi' }}
      CODEX_BIN: ${{ vars.CODEX_BIN || 'codex' }}
      AUTO_MERGE: ${{ vars.AUTONOMOUS_AUTO_MERGE || 'false' }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      INCIDENT_ALERT_EMAIL: gaessoft@gmail.com
      EMAIL_REMITENTE: ${{ vars.EMAIL_REMITENTE || 'no-reply@gaessoft.com' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install agent CLIs
        run: |
          # Las versiones y comandos se controlan desde el runner/variables del repo.
          # El job falla cerrado si una CLI no está instalada.
          command -v "$KIMI_BIN"
          command -v "$CODEX_BIN"
          CODEX_HOME="$GITHUB_WORKSPACE/.codex-runner"
          mkdir -p "$CODEX_HOME"
          if [[ -f "$HOME/.codex/auth.json" ]]; then cp "$HOME/.codex/auth.json" "$CODEX_HOME/auth.json"; fi
          if [[ -f "$HOME/.codex/config.toml" ]]; then cp "$HOME/.codex/config.toml" "$CODEX_HOME/config.toml"; fi
          chmod 700 "$CODEX_HOME"
          echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
          timeout --signal=TERM --kill-after=10s 45s "$KIMI_BIN" -p "Responde únicamente KIMI_READY" --output-format text | grep -q KIMI_READY
          timeout --signal=TERM --kill-after=10s 45s "$CODEX_BIN" exec --sandbox read-only --ephemeral "Responde únicamente CODEX_READY" | grep -q CODEX_READY

      - name: Kimi ejecuta, Codex juzga y publica solo si aprueba
        run: bash scripts/autonomous-front-cycle.sh
