name: Autonomous storefront cycle

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: autonomous-front-cycle
  cancel-in-progress: false

# Las fases están separadas por jobs y artefactos. Ninguna CLI de modelo se
# ejecuta en el job que tiene GH_TOKEN o credenciales de correo.
jobs:
  executor:
    if: ${{ vars.AUTONOMOUS_FRONT_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_work: ${{ steps.detect_work.outputs.has_work }}
      artifact_id: ${{ steps.upload_artifact.outputs.artifact-id }}
    env:
      CODEX_BIN: ${{ vars.CODEX_BIN || 'codex' }}
      CODEX_VERSION: "0.130.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Comprobar tarea pendiente antes de preparar agentes
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/gaes-autonomy-artifact"
          mkdir -p "$ARTIFACT_DIR"
          pending_prs="$(gh pr list --state open --base main --json headRefName --jq '.[] | select(.headRefName | startswith("automation/front-cycle-")) | .headRefName')"
          if [[ -n "$pending_prs" ]]; then
            printf '%s\n' waiting-review > "$ARTIFACT_DIR/waiting-review"
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY_PREFLIGHT'
          import os, re
          from pathlib import Path
          pending = any(re.match(r'^- \[ \] ST-[0-9]+ \|', line) for line in Path('automation/front-backlog.md').read_text().splitlines())
          if not pending:
              artifact = Path(os.environ['RUNNER_TEMP']) / 'gaes-autonomy-artifact'
              (artifact / 'no-work').write_text('no-work\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'has_work={str(pending).lower()}\n')
          PY_PREFLIGHT
          fi
      - name: Instalar Codex CLI fijado
        if: steps.preflight.outputs.has_work == 'true'
        run: |
          npm install --global "@openai/codex@${CODEX_VERSION}"
          command -v "$CODEX_BIN"
      - name: Preparar autenticación aislada del ejecutor
        if: steps.preflight.outputs.has_work == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: ${{ runner.temp }}/codex-executor-home
        run: |
          test -n "$OPENAI_API_KEY"
          mkdir -p -m 700 "$CODEX_HOME"
          printf '%s' "$OPENAI_API_KEY" | "$CODEX_BIN" login --with-api-key
      - name: Ejecutar tarea sin credenciales de publicación
        if: steps.preflight.outputs.has_work == 'true'
        env:
          CODEX_AUTH_READY: "true"
          CODEX_HOME: ${{ runner.temp }}/codex-executor-home
        run: AUTONOMY_PREFLIGHT_WAITING=true AUTONOMY_PHASE=executor bash scripts/autonomous-front-cycle-phase.sh
      - name: Eliminar autenticación del ejecutor
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/codex-executor-home"
      - name: Detectar backlog vacío
        id: detect_work
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/gaes-autonomy-artifact"
          if [[ -f "$ARTIFACT_DIR/no-work" || -f "$ARTIFACT_DIR/waiting-review" ]]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        id: upload_artifact
        with:
          name: autonomous-front-executor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gaes-autonomy-artifact
          include-hidden-files: true
          if-no-files-found: error

  validate:
    needs: executor
    if: ${{ needs.executor.result == 'success' && needs.executor.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload_artifact.outputs.artifact-id }}
    env:
      AUTONOMY_VALIDATE_ISOLATED: "true"
      AUTONOMY_VALIDATE_IMAGE: "node:24-bookworm-slim@sha256:ec857ea6bb60cb3d0fa4d97495590c5fe7d51be8572c307b55957eeb06569cf7"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.executor.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/gaes-autonomy-artifact
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preparar imagen de validación fijada
        run: docker pull "$AUTONOMY_VALIDATE_IMAGE"
      - name: Validar patch y ejecutar checks
        run: AUTONOMY_PHASE=validate bash scripts/autonomous-front-cycle-phase.sh
      - uses: actions/upload-artifact@v4
        id: upload_artifact
        with:
          name: autonomous-front-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gaes-autonomy-artifact
          include-hidden-files: true
          if-no-files-found: error

  judge:
    needs: [executor, validate]
    if: ${{ needs.validate.result == 'success' && needs.executor.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload_artifact.outputs.artifact-id }}
    env:
      CODEX_BIN: ${{ vars.CODEX_BIN || 'codex' }}
      CODEX_VERSION: "0.130.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.executor.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/gaes-autonomy-artifact
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/gaes-autonomy-validated
      - name: Transferir solo metadata validada
        run: |
          cp "$RUNNER_TEMP/gaes-autonomy-validated/validated-base.sha" "$RUNNER_TEMP/gaes-autonomy-artifact/validated-base.sha"
          cp "$RUNNER_TEMP/gaes-autonomy-validated/validation.json" "$RUNNER_TEMP/gaes-autonomy-artifact/validation.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar Codex CLI fijado
        run: |
          npm install --global "@openai/codex@${CODEX_VERSION}"
          command -v "$CODEX_BIN"
      - name: Preparar autenticación aislada de Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: ${{ runner.temp }}/codex-judge-home
        run: |
          test -n "$OPENAI_API_KEY"
          mkdir -p -m 700 "$CODEX_HOME"
          printf '%s' "$OPENAI_API_KEY" | "$CODEX_BIN" login --with-api-key
      - name: Revisar en read-only
        env:
          CODEX_AUTH_READY: "true"
          CODEX_HOME: ${{ runner.temp }}/codex-judge-home
        run: AUTONOMY_PHASE=judge bash scripts/autonomous-front-cycle-phase.sh
      - name: Eliminar autenticación del juez
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/codex-judge-home"
      - uses: actions/upload-artifact@v4
        id: upload_artifact
        with:
          name: autonomous-front-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gaes-autonomy-artifact
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [executor, judge]
    if: ${{ needs.judge.result == 'success' && needs.executor.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      AUTO_MERGE: ${{ vars.AUTONOMOUS_AUTO_MERGE || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.judge.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/gaes-autonomy-artifact
      - name: Publicar solo patch aprobado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          INCIDENT_ALERT_EMAIL: gaessoft@gmail.com
          EMAIL_REMITENTE: ${{ vars.EMAIL_REMITENTE }}
        run: AUTONOMY_PHASE=publish bash scripts/autonomous-front-cycle-phase.sh

  notify:
    needs: [executor, validate, judge, publish]
    if: ${{ always() && (needs.executor.result == 'failure' || needs.validate.result == 'failure' || needs.judge.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Notificar fallo sin exponer logs ni secretos
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          INCIDENT_ALERT_EMAIL: gaessoft@gmail.com
          EMAIL_REMITENTE: ${{ vars.EMAIL_REMITENTE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXECUTOR_STATUS: ${{ needs.executor.result }}
          VALIDATE_STATUS: ${{ needs.validate.result }}
          JUDGE_STATUS: ${{ needs.judge.result }}
          PUBLISH_STATUS: ${{ needs.publish.result }}
        run: |
          if [[ -z "$EMAIL_REMITENTE" || -z "${RESEND_API_KEY}${BREVO_API_KEY}" ]]; then
            echo "Notificación omitida: proveedor o remitente no configurado" >&2
            exit 0
          fi
          python3 - <<'PY' | python3 scripts/send-system-email.py
          import json, os
          json.dump({
              'subject': 'GaesSoft automation: fallo en ciclo autónomo',
            'text': (f'Pantalla: storefront frontend\nEstado: el ciclo no completó; revisa el estado de publicación en el run enlazado.\n'
                       f'Run: {os.environ["RUN_URL"]}\n'
                       f'Fases: executor={os.environ["EXECUTOR_STATUS"]}, validate={os.environ["VALIDATE_STATUS"]}, '
                       f'judge={os.environ["JUDGE_STATUS"]}, publish={os.environ["PUBLISH_STATUS"]}.\n'
                       'Para revisar: abre el run enlazado y consulta el resumen de cada fase; no se incluyen logs ni secretos en este correo.'),
          }, __import__('sys').stdout)
          PY
