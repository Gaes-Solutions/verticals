name: Android staging APK smoke
on:
  push:
    branches: [trabajo/codex-tienda-08sep]
    paths:
      - .github/workflows/android-staging-smoke.yml
      - apps/mobile-cliente/.maestro/**
      - scripts/testing/publish-native-result.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-staging-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify the staging APK and Maestro
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          curl --fail --location --retry 2 'https://expo.dev/artifacts/eas/9VMjiNMARcgEsBWhAavocn039okqGQwclbNNI-cJdyY.apk' -o "$RUNNER_TEMP/native/client.apk"
          printf '%s  %s\n' '0359997e95ee90b593b99d22a2aa3af0172936742366e910d846eddea47c9d3e' "$RUNNER_TEMP/native/client.apk" | sha256sum -c -
          python3 scripts/testing/check-customer-apk.py "$RUNNER_TEMP/native/client.apk" --version 10 --universal --sdk "$ANDROID_HOME"
          curl --fail --location --retry 2 'https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip' -o "$RUNNER_TEMP/native/maestro.zip"
          printf '%s  %s\n' '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a' "$RUNNER_TEMP/native/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/native/maestro.zip" -d "$RUNNER_TEMP/native/cli"
          find "$RUNNER_TEMP/native/cli" -path '*/bin/maestro' -printf '%h\n' >> "$GITHUB_PATH"
      - name: Enable KVM for the disposable runner
        run: |
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          # Universal APK includes native x86_64 React Native and Hermes libraries.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Each script line uses a separate shell; set cwd on the action.
          working-directory: apps/mobile-cliente
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          script: |
            mkdir -p "$RUNNER_TEMP/native/results"
            adb install -r "$RUNNER_TEMP/native/client.apk" > "$RUNNER_TEMP/native/results/install.log" 2>&1 || { cat "$RUNNER_TEMP/native/results/install.log"; exit 1; }
            maestro test --format junit --output "$RUNNER_TEMP/native/results/results.xml" .maestro/native-guest.yml > "$RUNNER_TEMP/native/results/maestro.log" 2>&1 || { cat "$RUNNER_TEMP/native/results/maestro.log"; adb exec-out screencap -p > gaesland-native-failure.png; adb shell uiautomator dump /sdcard/native-ui.xml >/dev/null 2>&1; adb pull /sdcard/native-ui.xml "$RUNNER_TEMP/native/results/view-hierarchy.xml" >/dev/null 2>&1; adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > "$RUNNER_TEMP/native/results/crash.log"; exit 1; }
            cat "$RUNNER_TEMP/native/results/maestro.log"
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-staging-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native/results
            apps/mobile-cliente/gaesland-*.png
            ~/.maestro/tests
          if-no-files-found: ignore
      - name: Publish bounded QA evidence on a separate result branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_NATIVE_STATUS: ${{ job.status }}
          QA_APK_VERSION: '10'
        run: python3 scripts/testing/publish-native-result.py
