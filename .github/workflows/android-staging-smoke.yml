name: Android staging APK smoke
on:
  push:
    branches: [trabajo/codex-tienda-08sep]
    paths:
      - .github/workflows/android-staging-smoke.yml
      - apps/mobile-cliente/.maestro/**
      - apps/mobile-kiosko/.maestro/**
      - scripts/testing/android-staging-*
      - scripts/testing/publish-staging-apks*
      - scripts/testing/publish-native-result.py
      - scripts/testing/*native*
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-staging-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate embedded Maestro expressions before starting an emulator
        run: node scripts/testing/check-native-flows.cjs
      - name: Verify that both APKs match current runtime sources
        run: python3 scripts/testing/check-native-source-provenance.py
      - name: Resolve published APKs or the immutable bootstrap payload
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/testing/prepare-native-artifacts.py
      - name: Check out bootstrap APKs only before the first verified release
        if: steps.artifacts.outputs.payload == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.artifacts.outputs.payloadCommit }}
          path: .native-apk-payload
          persist-credentials: false
      - name: Verify bootstrap APKs
        if: steps.artifacts.outputs.payload == 'true'
        run: python3 scripts/testing/prepare-native-artifacts.py payload
      - name: Inspect both signed APKs and download pinned Maestro
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          python3 scripts/testing/check-customer-apk.py "$RUNNER_TEMP/native/client.apk" --version "${{ steps.artifacts.outputs.clientVersion }}" --universal --sdk "$ANDROID_HOME"
          node scripts/testing/check-kiosko-apk.cjs "$RUNNER_TEMP/native/kiosk.apk"
          curl --fail --location --retry 2 'https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip' -o "$RUNNER_TEMP/native/maestro.zip"
          printf '%s  %s\n' '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a' "$RUNNER_TEMP/native/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/native/maestro.zip" -d "$RUNNER_TEMP/native/cli"
          find "$RUNNER_TEMP/native/cli" -path '*/bin/maestro' -printf '%h\n' >> "$GITHUB_PATH"
      - name: Check immutable proof before repeating the same Android tests
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/testing/verify-native-smoke-proof.py
      - name: Prepare isolated synthetic shopper credentials
        if: steps.proof.outputs.reusable != 'true'
        run: python3 scripts/testing/prepare-native-fixture.py
      - name: Enable KVM for the disposable runner
        if: steps.proof.outputs.reusable != 'true'
        run: |
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        if: steps.proof.outputs.reusable != 'true'
        with:
          # Universal APK includes native x86_64 React Native and Hermes libraries.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Each script line uses a separate shell; set cwd on the action.
          working-directory: apps/mobile-cliente
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 2
          script: bash ../../scripts/testing/run-native-smoke.sh
      - name: Record automation readiness without exposing credentials
        if: always()
        env:
          READY_ENABLED: ${{ vars.AUTONOMOUS_FRONT_ENABLED == 'true' }}
          READY_AUTO_MERGE: ${{ vars.AUTONOMOUS_AUTO_MERGE == 'true' }}
          READY_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          READY_BREVO_KEY: ${{ secrets.BREVO_API_KEY != '' }}
          READY_RESEND_KEY: ${{ secrets.RESEND_API_KEY != '' }}
          READY_EMAIL_SENDER: ${{ vars.EMAIL_REMITENTE != '' }}
        run: |
          python3 - <<'PY_READY'
          import json, os
          from pathlib import Path
          result = {key.removeprefix('READY_').lower(): value == 'true' for key, value in os.environ.items() if key.startswith('READY_')}
          directory = Path(os.environ['RUNNER_TEMP']) / 'native/results'
          directory.mkdir(parents=True, exist_ok=True)
          (directory / 'automation-readiness.json').write_text(json.dumps(result, indent=2) + '\n')
          print('Recorded boolean configuration readiness; no credentials were passed to this process')
          PY_READY
      - name: Sanitize all publishable text evidence
        id: sanitize
        if: always()
        run: python3 scripts/testing/sanitize-native-results.py
      - name: Publish both APKs only after successful Android checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/testing/publish-staging-apks.cjs
      - name: Save native test evidence
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-staging-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native/results
            apps/mobile-cliente/gaesland-*.png
          if-no-files-found: ignore
      - name: Publish bounded QA evidence on a separate result branch
        if: always() && steps.sanitize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          QA_NATIVE_STATUS: ${{ job.status }}
        run: python3 scripts/testing/publish-native-result.py
