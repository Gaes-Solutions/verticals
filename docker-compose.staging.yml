# Override para el ambiente de testing/staging.
# Uso:
#   docker compose -p gaespos-staging -f docker-compose.prod.yml \
#     -f docker-compose.staging.yml --env-file .env.staging up -d
#
# El proyecto Compose separado crea volúmenes y red distintos de producción.
services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-gaes-solutions/gaespos}/api:${API_TAG:-staging}
    ports:
      - "${STAGING_API_PORT:-3100}:3000"

  web-tienda:
    image: ghcr.io/${GITHUB_REPOSITORY:-gaes-solutions/gaespos}/web-tienda:${TIENDA_TAG:-staging}
    ports:
      - "${STAGING_TIENDA_PORT:-3101}:3001"

  web-admin:
    image: ghcr.io/${GITHUB_REPOSITORY:-gaes-solutions/gaespos}/web-admin:${ADMIN_TAG:-staging}
    ports:
      - "${STAGING_ADMIN_PORT:-5175}:80"

  web-pos:
    image: ghcr.io/${GITHUB_REPOSITORY:-gaes-solutions/gaespos}/web-pos:${POS_TAG:-staging}
    ports:
      - "${STAGING_POS_PORT:-5178}:80"

  web-superadmin:
    image: ghcr.io/${GITHUB_REPOSITORY:-gaes-solutions/gaespos}/web-superadmin:${SUPERADMIN_TAG:-staging}
    ports:
      - "${STAGING_SUPERADMIN_PORT:-5179}:80"
